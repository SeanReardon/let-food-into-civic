name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:  # Allow manual triggers

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with branch name
            type=ref,event=branch
            # Tag with PR number
            type=ref,event=pr
            # Tag with semver (v1.2.3 -> 1.2.3, v1.2.3 -> 1.2, v1.2.3 -> 1)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Tag with short SHA
            type=sha,prefix=

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Generate build summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  sign-verify-and-promote:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: [build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Install checksum-pinned Cosign
        shell: bash
        run: |
          set -euo pipefail
          install -d "${RUNNER_TEMP}/cosign-bin"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64 \
            -o "${RUNNER_TEMP}/cosign-bin/cosign"
          printf '%s  %s\n' \
            4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71 \
            "${RUNNER_TEMP}/cosign-bin/cosign" | sha256sum --check --strict
          chmod 0755 "${RUNNER_TEMP}/cosign-bin/cosign"
          echo "${RUNNER_TEMP}/cosign-bin" >> "$GITHUB_PATH"

      - name: Log in to GHCR with existing deploy-auth
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Prepare registry manifest promotion
        uses: docker/setup-buildx-action@v4

      - name: Sign and verify the immutable image
        shell: bash
        env:
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p image-digests
          printf '%s\n' "$DIGEST" > image-digests/let-food-into-civic.txt
          image=ghcr.io/seanreardon/let-food-into-civic
          cosign sign --yes -a "repository=${image}" "${image}@${DIGEST}"
          cosign verify -a "repository=${image}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity https://github.com/SeanReardon/let-food-into-civic/.github/workflows/build_and_push.yml@refs/heads/main \
            --certificate-github-workflow-sha "$SOURCE_SHA" \
            "${image}@${DIGEST}"
          printf 'Verified image: `%s@%s`\n' "$image" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Save immutable digest for Dallas admission
        uses: actions/upload-artifact@v4
        with:
          name: let-food-into-civic-digests
          path: image-digests/*.txt
          if-no-files-found: error
          retention-days: 90

      - name: Promote only the signed current-main image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          set -euo pipefail
          main_sha="$(gh api repos/SeanReardon/let-food-into-civic/commits/main --jq .sha)"
          if [[ "$main_sha" != "$SOURCE_SHA" ]]; then
            echo "Newer main exists; leaving production tags unchanged."
            exit 0
          fi
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image=ghcr.io/seanreardon/let-food-into-civic
          docker buildx imagetools create --prefer-index=false \
            --tag "${image}:prod" --tag "${image}:latest" "${image}@${DIGEST}"
          for tag in prod latest; do
            resolved="$(docker buildx imagetools inspect "${image}:${tag}" | awk '/^Digest:/ {print $2; exit}')"
            [[ "$resolved" == "$DIGEST" ]] || { echo "Promoted digest mismatch"; exit 1; }
          done
